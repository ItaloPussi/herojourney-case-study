name: Assemble HQ screenshots

on:
  push:
    paths:
      - 'assets/hq-parts/**'
      - '.github/workflows/assemble-hq-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Assemble binary screenshot assets
        shell: bash
        run: |
          set -euo pipefail

          for name in planning dashboard commitments; do
            out="assets/${name}.webp"
            : > "$out"

            # Each .part file is an independently base64-encoded binary slice.
            # Decode each slice first, then concatenate the resulting bytes.
            while IFS= read -r part; do
              base64 --decode "$part" >> "$out"
            done < <(find assets/hq-parts -maxdepth 1 -type f -name "${name}.*.part" | sort)

            file "$out"
          done

      - name: Verify expected dimensions
        shell: bash
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path

          expected = {
              'planning': (1000, 1195),
              'dashboard': (832, 2048),
              'commitments': (1000, 910),
          }

          def webp_size(path):
              data = Path(path).read_bytes()
              if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                  raise ValueError(f'{path}: not WebP')
              kind = data[12:16]
              if kind == b'VP8X':
                  w = 1 + int.from_bytes(data[24:27], 'little')
                  h = 1 + int.from_bytes(data[27:30], 'little')
                  return w, h
              if kind == b'VP8 ':
                  start = data.find(b'\x9d\x01\x2a')
                  w, h = struct.unpack_from('<HH', data, start + 3)
                  return w & 0x3fff, h & 0x3fff
              if kind == b'VP8L':
                  b0,b1,b2,b3,b4 = data[20:25]
                  w = 1 + (((b2 & 0x3f) << 8) | b1)
                  h = 1 + (((b4 & 0x0f) << 10) | (b3 << 2) | ((b2 & 0xc0) >> 6))
                  return w,h
              raise ValueError(f'{path}: unsupported WebP')

          for name, dims in expected.items():
              got = webp_size(f'assets/{name}.webp')
              if got != dims:
                  raise SystemExit(f'{name}: expected {dims}, got {got}')
              print(name, got)
          PY

      - name: Commit binary assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/hq-parts
          rm -f assets/planning.b64 assets/dashboard.b64 assets/commitments.b64

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets
          git commit -m 'assets: replace encoded screenshots with binary WebP files'
          git push
